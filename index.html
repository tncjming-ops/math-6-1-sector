<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小六年級數學 6-1 扇形的弧長與周長 - 互動教學簡報</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google Fonts: Noto Sans TC & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- 載入 Font Awesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background-color: #0f172a; /* 深藍灰背景襯托 16:9 投影畫布 */
      color: #1e293b;
      overflow-x: hidden;
      user-select: none;
    }

    /* 16:9 簡報舞台容器 */
    .slide-stage {
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 84px);
      max-width: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    /* 統一色彩編碼 (Color Coding) */
    .color-arc { color: #e11d48; }       /* 紅色：弧長 */
    .bg-arc { background-color: #e11d48; }
    .border-arc { border-color: #e11d48; }

    .color-radius { color: #2563eb; }    /* 藍色：半徑/直徑 */
    .bg-radius { background-color: #2563eb; }
    .border-radius { border-color: #2563eb; }

    .color-angle { color: #059669; }     /* 綠色：圓心角比例 */
    .bg-angle { background-color: #059669; }
    .border-angle { border-color: #059669; }

    /* SVG 動畫過渡設定 */
    .svg-smooth {
      transition: all 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 濾紙關門閃爍動畫 */
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(37, 99, 235, 0.6)); }
      50% { filter: drop-shadow(0 0 12px rgba(37, 99, 235, 1)); }
    }
    .door-active {
      animation: pulseGlow 1.5s infinite;
    }

    /* 隱藏捲軸但保留功能 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 分數垂直排版 */
    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 0.2em;
      line-height: 1.05;
    }
    .frac > span:first-child {
      border-bottom: 2.5px solid currentColor;
      padding: 0 0.25em 2px 0.25em;
    }
    .frac > span:last-child {
      padding: 2px 0.25em 0 0.25em;
    }
  </style>
</head>
<body class="h-screen flex flex-col justify-between">

  <!-- 主工作區：左側簡報舞台 + 右側可收合講者備忘錄 -->
  <main class="flex-1 flex items-center justify-center p-3 md:p-5 overflow-hidden relative">
    
    <!-- 16:9 簡報主畫面 -->
    <div id="slideStage" class="slide-stage w-full rounded-2xl border-4 border-slate-200 relative overflow-hidden flex flex-col justify-between p-6 md:p-10">
      
      <!-- 頂部狀態列（頁碼、階段標籤、顏色圖例） -->
      <header class="flex items-center justify-between border-b-2 border-slate-100 pb-3 shrink-0">
        <div class="flex items-center gap-3">
          <span id="stageBadge" class="px-3.5 py-1 rounded-full text-sm md:text-base font-bold bg-indigo-100 text-indigo-800 tracking-wide">
            引起動機
          </span>
          <span id="textbookRef" class="text-slate-400 font-semibold text-sm md:text-base">
            課本 P.82
          </span>
        </div>

        <!-- 視覺色彩編碼提示 -->
        <div class="hidden sm:flex items-center gap-4 text-xs md:text-sm font-bold bg-slate-50 px-4 py-1.5 rounded-full border border-slate-200">
          <span class="flex items-center gap-1.5 text-rose-600">
            <span class="w-3 h-3 rounded-full bg-rose-600 inline-block"></span> 弧長（彎線）
          </span>
          <span class="flex items-center gap-1.5 text-blue-600">
            <span class="w-3 h-3 rounded-full bg-blue-600 inline-block"></span> 半徑／直徑（直線）
          </span>
          <span class="flex items-center gap-1.5 text-emerald-600">
            <span class="w-3 h-3 rounded-full bg-emerald-600 inline-block"></span> 圓心角比例
          </span>
        </div>

        <div class="text-slate-500 font-extrabold text-base md:text-lg">
          <span id="currentPageNum" class="text-indigo-600">1</span> / 12
        </div>
      </header>

      <!-- 動態投影片內容注入區 -->
      <section id="slideContent" class="flex-1 flex flex-col justify-center overflow-y-auto no-scrollbar py-3">
        <!-- 由 JavaScript 渲染各頁內容 -->
      </section>

      <!-- 底部頁尾資訊 -->
      <footer class="flex items-center justify-between text-xs md:text-sm text-slate-400 pt-2 border-t border-slate-100 shrink-0">
        <span>國小六年級上學期數學｜第六單元 扇形的周長和面積（活動 6-1）</span>
        <span>按鍵盤 ← → 鍵切換投影片</span>
      </footer>
    </div>

    <!-- 右側可收合「教師講者備忘錄」抽屜 -->
    <aside id="speakerDrawer" class="hidden w-80 lg:w-96 h-full max-h-[calc(100vh-84px)] ml-4 bg-slate-800 text-slate-100 rounded-2xl p-5 flex-col justify-between shadow-2xl border border-slate-700 shrink-0">
      <div>
        <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
          <h3 class="font-bold text-amber-400 flex items-center gap-2 text-lg">
            <i class="fa-solid fa-chalkboard-user"></i> 教師講者備忘錄
          </h3>
          <button onclick="toggleSpeakerNotes()" class="text-slate-400 hover:text-white p-1">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
        <div id="speakerNoteText" class="text-base leading-relaxed text-slate-200 space-y-3 overflow-y-auto max-h-[60vh]">
          <!-- 動態講稿內容 -->
        </div>
      </div>
      <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700 text-xs text-slate-300">
        <p class="font-bold text-emerald-400 mb-1"><i class="fa-solid fa-lightbulb"></i> 公開授課觀課重點提示：</p>
        <p id="teachingTipText">引導學生觀察視覺色彩編碼，建立「弧長」與「周長」的結構差異。</p>
      </div>
    </aside>

  </main>

  <!-- 底部教師控制台（導覽列 + 互動工具列） -->
  <nav class="h-16 bg-slate-900 border-t border-slate-800 px-4 md:px-8 flex items-center justify-between text-white shrink-0">
    <!-- 左側：頁面選擇與前後翻頁 -->
    <div class="flex items-center gap-2 md:gap-3">
      <button onclick="prevSlide()" id="btnPrev" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 font-bold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-chevron-left"></i> <span class="hidden sm:inline">上一頁</span>
      </button>
      
      <select id="slideSelector" onchange="goToSlide(parseInt(this.value))" class="bg-slate-800 border border-slate-700 text-white text-sm md:text-base font-bold rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 max-w-[180px] md:max-w-xs">
        <!-- 動態生成 12 頁選單 -->
      </select>

      <button onclick="nextSlide()" id="btnNext" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 font-bold flex items-center gap-1.5 transition">
        <span class="hidden sm:inline">下一頁</span> <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- 中間：內建課堂倒數計時器 -->
    <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
      <i class="fa-regular fa-clock text-amber-400"></i>
      <span id="timerDisplay" class="font-mono font-extrabold text-lg md:text-xl text-amber-300 w-16 text-center">03:00</span>
      <button onclick="setTimer(180)" class="text-xs px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 font-bold" title="設定 3 分鐘">3分</button>
      <button onclick="setTimer(240)" class="text-xs px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 font-bold" title="設定 4 分鐘">4分</button>
      <button onclick="toggleTimer()" id="btnTimerToggle" class="text-xs px-2.5 py-1 rounded bg-emerald-600 hover:bg-emerald-500 font-bold">
        開始
      </button>
      <button onclick="resetTimer()" class="text-xs px-2 py-1 rounded bg-slate-700 hover:bg-slate-600" title="重設計時器">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
    </div>

    <!-- 右側：講稿切換與全螢幕投影 -->
    <div class="flex items-center gap-2">
      <button onclick="toggleSpeakerNotes()" id="btnNotes" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-bold text-sm flex items-center gap-2 transition">
        <i class="fa-solid fa-comment-dots text-amber-400"></i>
        <span class="hidden md:inline">講者備忘錄</span>
      </button>
      <button onclick="toggleFullscreen()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 font-bold text-sm flex items-center gap-2 transition" title="全螢幕投影">
        <i class="fa-solid fa-expand text-sky-400"></i>
        <span class="hidden md:inline">全螢幕</span>
      </button>
    </div>
  </nav>

  <!-- 課堂提示訊息框（取代 alert） -->
  <div id="toastBox" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl border border-slate-700 font-bold text-base z-50 hidden transition-opacity duration-300">
  </div>

  <script>

    // ==========================================
    let currentSlide = 0;

    // 互動狀態變數
    let quizRevealed = [false, false, false];

              <div class="pt-4 flex flex-wrap gap-4 text-base md:text-lg font-bold text-slate-500">

        render: () => `

            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

    function initSelector() {

      ).join('');
    }

    function renderSlide() {
      const data = slidesData[currentSlide];
      document.getElementById('stageBadge').textContent = data.stage;
      document.getElementById('textbookRef').textContent = data.ref;
      document.getElementById('currentPageNum').textContent = currentSlide + 1;
      document.getElementById('slideContent').innerHTML = data.render();
      document.getElementById('speakerNoteText').innerHTML = `<p>${data.speaker}</p>`;
      document.getElementById('teachingTipText').textContent = data.tip;

      document.getElementById('slideSelector').value = currentSlide;
      document.getElementById('btnPrev').disabled = currentSlide === 0;
      document.getElementById('btnNext').disabled = currentSlide === slidesData.length - 1;

      // 同步鏡像計時器顯示
      updateTimerUI();
    }

    function goToSlide(index) {
      if (index >= 0 && index < slidesData.length) {
        currentSlide = index;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

      if (e.key === 'ArrowRight' || e.key === 'PageDown') {

      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      }

      updateTimerUI();
    }

    function toggleTimer() {
      const btn = document.getElementById('btnTimerToggle');
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.textContent = '繼續';
        btn.classList.replace('bg-amber-600', 'bg-emerald-600');
      } else {
        if (timerSeconds <= 0) timerSeconds = timerDefault;
        btn.textContent = '暫停';
        btn.classList.replace('bg-emerald-600', 'bg-amber-600');
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerUI();
          } else {
            clearInterval(timerInterval);
            timerInterval = null;
            btn.textContent = '開始';
            btn.classList.replace('bg-amber-600', 'bg-emerald-600');
            showToast("⏰ 時間到！請小組停止討論，準備上台分享！");
          }
        }, 1000);
      }
    }

    function resetTimer() {
      setTimer(timerDefault);
    }

    // 初始化啟動
    window.onload = function () {
      initSelector();
      renderSlide();
    };
  </script>
</body>
</html>
